name: Unzip and Setup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          set -e
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: no zip file found in repo root"
            exit 1
          fi
          echo "Using $ZIP"
          rm -rf /tmp/x
          mkdir -p /tmp/x
          unzip -o -q "$ZIP" -d /tmp/x
          SRC=/tmp/x
          E=$(ls -A /tmp/x)
          C=$(echo "$E" | wc -l)
          if [ "$C" = "1" ] && [ -d "/tmp/x/$E" ]; then
            SRC="/tmp/x/$E"
          fi
          echo "Source dir: $SRC"
          cp -r "$SRC"/. .
          rm -f "$ZIP"
          rm -f .github/workflows/unzip.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Setup project from zip"
          git push
          
