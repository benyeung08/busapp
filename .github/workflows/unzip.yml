name: Unzip

# 手機上傳專用：上傳 .zip 後手動執行本工作流程，由 Actions 在伺服器端解壓。
# 只需執行一次；完成後本檔與 .zip 會自動刪除。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip
        run: |
          set -e
          shopt -s dotglob
          ZIP=$(ls *.zip 2>/dev/null | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "::error::找不到 .zip，請先上傳 hk-transit-eta.zip"
            exit 1
          fi
          rm -rf /tmp/u && mkdir -p /tmp/u
          unzip -o -q "$ZIP" -d /tmp/u
          E=$(ls -A /tmp/u); C=$(echo "$E" | wc -l)
          if [ "$C" = "1" ] && [ -d "/tmp/u/$E" ]; then SRC="/tmp/u/$E"; else SRC=/tmp/u; fi
          cp -r "$SRC"/. .
          rm -f "$ZIP" .github/workflows/unzip.yml
          echo "解壓完成，來源：$SRC"

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "Setup project"
            git push
            echo "已提交"
          fi
          
