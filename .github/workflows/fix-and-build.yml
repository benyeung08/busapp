name: Fix Repo and Build APK

on:
  workflow_dispatch:

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix missing Gradle files
        run: |
          # 1. 建立 gradle wrapper (解決你而家 gradlew 失效問題)
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          
          # 2. 如果無 settings.gradle 就建立
          if [ ! -f settings.gradle ]; then
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF
          fi

          # 3. 如果無 root build.gradle 就建立
          if [ ! -f build.gradle ]; then
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF
          fi

          # 4. 確保 gradle.properties 存在
          if [ ! -f gradle.properties ]; then
          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF
          fi

          # 5. 修正 ApiConfig 用你自己個名，解決 CORS
          mkdir -p app/src/main/java/com/hkbus/allinone
          cat > app/src/main/java/com/hkbus/allinone/ApiConfig.kt <<'EOF'
          package com.hkbus.allinone
          import java.net.URLEncoder
          object ApiConfig {
              const val STATIC_BASE = "https://raw.githubusercontent.com/benyeung08/hketaapp/main/docs/data/"
              const val PROXY_BASE = "https://hketaapp.vercel.app/api/proxy?url="
              fun proxy(url: String): String = PROXY_BASE + URLEncoder.encode(url, "UTF-8")
              fun kmbEtaUrl(stopId: String, route: String, serviceType: String): String {
                  return proxy("https://data.etabus.gov.hk/v1/transport/kmb/eta/${stopId}/${route}/${serviceType}")
              }
          }
          EOF

      - name: Commit fixes
        run: |
          git config user.name "fix-bot"
          git config user.email "bot@github.com"
          git add -A
          git diff --staged --quiet || git commit -m "auto fix gradle and ApiConfig for benyeung08"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate wrapper and Build
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hketaapp-fixed-apk
          path: app/build/outputs/apk/debug/*.apk
