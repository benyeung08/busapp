name: Final Build APK - No Wrapper Needed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create missing files for benyeung08
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF
          
          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          mkdir -p app/src/main/java/com/hkbus/allinone
          cat > app/src/main/java/com/hkbus/allinone/ApiConfig.kt <<'EOF'
          package com.hkbus.allinone
          import java.net.URLEncoder
          object ApiConfig {
              const val STATIC_BASE = "https://raw.githubusercontent.com/benyeung08/hketaapp/main/docs/data/"
              const val PROXY_BASE = "https://hketaapp.vercel.app/api/proxy?url="
              fun proxy(url: String): String = PROXY_BASE + URLEncoder.encode(url, "UTF-8")
          }
          EOF

      - name: Build APK
        run: |
          cd app
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hketaapp-final
          path: app/build/outputs/apk/debug/*.apk
