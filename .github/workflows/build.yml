name: Build APK File Not Found Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create fixed project - load Vercel not GitHub Pages
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/hkbus/allinone
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets

          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.2.2' apply false }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.hkbus.allinone'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hkbus.allinone"
                  minSdk 24
                  targetSdk 34
                  versionCode 10
                  versionName "1.9-file-not-found-fixed"
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">全港交通</string></resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name" android:theme="@android:style/Theme.NoTitleBar" android:hardwareAccelerated="true">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          # 本地後備頁，如果網絡都唔得都唔會 File not found
          cat > app/src/main/assets/index.html <<'EOF'
          <!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
          <title>全港交通</title></head><body style="font-family:sans-serif;padding:20px">
          <h2>載入中...</h2><p>正在連接 hketaapp.vercel.app</p>
          <script>location.href="https://hketaapp.vercel.app"</script>
          </body></html>
          EOF

          cat > app/src/main/java/com/hkbus/allinone/MainActivity.java <<'EOF'
          package com.hkbus.allinone;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceError;

          public class MainActivity extends Activity {
              WebView wv;
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.getSettings().setDomStorageEnabled(true);
