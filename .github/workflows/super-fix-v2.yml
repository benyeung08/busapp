name: Super Fix V2 - Java No Kotlin

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Java-only project
        run: |
          rm -rf app
          mkdir -p app/src/main/java/com/hkbus/allinone
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cat > settings.gradle <<'EOF'
          include ':app'
          EOF

          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.2.2'
          }
          android {
              namespace 'com.hkbus.allinone'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hkbus.allinone"
                  minSdk 21
                  targetSdk 34
                  versionCode 5
                  versionName "1.4-final"
              }
              buildTypes {
                  debug { minifyEnabled false }
                  release { minifyEnabled false }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources><string name="app_name">全港交通</string></resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="@string/app_name">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hkbus/allinone/MainActivity.java <<'EOF'
          package com.hkbus.allinone;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;
          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView wv = new WebView(this);
                  wv.getSettings().setJavaScriptEnabled(true);
                  wv.getSettings().setDomStorageEnabled(true);
                  wv.setWebViewClient(new WebViewClient());
                  // 用你自己 GitHub Pages，無 CORS，已包含九巴城巴嶼巴港鐵巴士重鐵輕鐵
                  wv.loadUrl("https://benyeung08.github.io/hketaapp/");
                  setContentView(wv);
              }
          }
          EOF

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hketaapp-final-v2
          path: app/build/outputs/apk/debug/*.apk
