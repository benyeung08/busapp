name: Sync Bus Data to GitHub (解決CORS)
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install requests
          python - << 'PY'
          import requests, json, os
          os.makedirs("docs/data", exist_ok=True)
          try:
              r = requests.get("https://data.etabus.gov.hk/v1/transport/kmb/route/", timeout=30)
              open("docs/data/kmb_route.json","w",encoding="utf-8").write(r.text)
          except Exception as e:
              print(e)
          try:
              r = requests.get("https://rt.data.gov.hk/v2/transport/citybus/route/CTB", timeout=30)
              open("docs/data/ctb_route.json","w",encoding="utf-8").write(r.text)
          except Exception as e:
              print(e)
          PY
      - run: |
          git config user.name "bus-bot"
          git config user.email "bot@github.com"
          git add docs/data/
          git diff --staged --quiet || git commit -m "auto: sync bus data"
          git push
