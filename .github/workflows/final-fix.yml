name: Final Fix - Must Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Overwrite with minimal working project
        run: |
          # 1. root files
          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
          }
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          EOF

          # 2. 最簡 app/build.gradle - 保證 Build 到
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.hkbus.allinone'
              compileSdk 34
              defaultConfig {
                  applicationId "com.hkbus.allinone"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "1.2-github-cors-fixed"
              }
              buildTypes { release { minifyEnabled false } debug { minifyEnabled false } }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # 3. 用最簡 MainActivity 包 WebView，讀你自己 GitHub Pages，無 CORS
          mkdir -p app/src/main/java/com/hkbus/allinone
          cat > app/src/main/java/com/hkbus/allinone/MainActivity.kt <<'EOF'
          package com.hkbus.allinone
          import android.os.Bundle
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val wv = WebView(this)
                  wv.settings.javaScriptEnabled = true
                  wv.settings.domStorageEnabled = true
                  wv.webViewClient = WebViewClient()
                  // 讀你自己 GitHub Pages，已經解決 CORS
                  wv.loadUrl("https://benyeung08.github.io/hketaapp/")
                  setContentView(wv)
              }
          }
          EOF

          # 4. AndroidManifest 最簡
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <application android:label="全港交通" android:theme="@android:style/Theme.NoTitleBar">
              <activity android:name=".MainActivity" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          git config user.name "bot"
          git config user.email "bot@github.com"
          git add -A
          git commit -m "final fix minimal build" || true
          git push

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Build
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: hketaapp-final-apk
          path: app/build/outputs/apk/debug/*.apk
